# The Swift runtime `containerization-framework` links against is dynamic and
# referenced as `@rpath/libswift_Concurrency.dylib`, so every binary that links
# it — including test binaries — needs this rpath or dies in dyld at launch.
# A rustflag is the one mechanism that reaches every kind of target, so it is
# the only place the rpath is set; a build script emitting it as well would
# draw `ld: duplicate -rpath ignored`.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
