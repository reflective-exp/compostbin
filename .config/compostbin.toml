[claude]
seed_from_keychain = true

[container]
cpus = 4
env = []
memory = "8G"

[host]
clipboard = true

[host.commands.audit]
argv = ["cargo", "audit"]

[host.commands.check]
argv = ["cargo", "check", "--workspace", "--all-targets"]

[host.commands.clippy]
argv = ["cargo", "clippy", "--", "-D", "warnings"]

[host.commands.fmt]
argv = ["cargo", "fmt", "--all"]

# Exact: no arguments, the whole suite.
[host.commands.test]
argv = ["cargo", "nextest", "run", "--workspace"]
tty = true

# Widened deliberately, for the iterate-on-one-failing-test loop.
[host.commands.test-one]
arguments = true
argv = ["cargo", "nextest", "run"]
deny = ["--config", "--manifest-path", "-Z"]
tty = true

[image]
packages = ["direnv"]
run = ["""echo 'eval "$(direnv hook bash)"' >> ~/.bashrc"""]

[project]
image = "compostbin/base:latest"
name = "compostbin"

[workspace]
roots = []
