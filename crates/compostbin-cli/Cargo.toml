[package]
edition.workspace = true
license.workspace = true
name = "compostbin-cli"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "compostbin_cli"
path = "src/lib.rs"

[[bin]]
name = "compostbin"
path = "src/main.rs"

[dependencies]
apple-container.workspace = true
clap.workspace = true
compostbin-core.workspace = true

# The framework experiment. macOS-only, so that the workspace still checks from
# inside a session's own Debian guest.
[target.'cfg(target_os = "macos")'.dependencies]
containerization-framework-bridge.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
strict = [] # Treat warnings as a build error.
