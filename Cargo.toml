[workspace]
members = ["crates/apple-container", "crates/compostbin-cli", "crates/compostbin-core", "crates/compostbin-test"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/reflective-dev/compostbin"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
apple-container = { path = "crates/apple-container" }
clap = { version = "4", features = ["derive"] }
compostbin-core = { path = "crates/compostbin-core" }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
