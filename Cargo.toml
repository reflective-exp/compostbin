[workspace]
members = [
  "crates/compostbin-engine",
  "crates/compostbin-cli",
  "crates/compostbin-core",
  "crates/compostbin-test",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/reflective-dev/compostbin"
rust-version = "1.98"
version = "0.9.1"

[workspace.dependencies]
compostbin-engine = { path = "crates/compostbin-engine" }
clap = { version = "4", features = ["derive"] }
compostbin-core = { path = "crates/compostbin-core" }
containerization-framework = "0.1"
getrandom = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
swift-bridge = "0.1.59"
swift-bridge-build = "0.1.59"
tempfile = "3"
toml = "1"
